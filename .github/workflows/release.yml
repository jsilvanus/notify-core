# Release flow (Changesets), same as fffleet:
# 1. A PR adds a changeset (`npm run changeset`) and is merged to main.
# 2. This workflow opens or updates the "Version Packages" PR.
# 3. Merging that PR runs this workflow again and publishes to npm.
# Publishing uses npm trusted publishing (OIDC); no NPM_TOKEN secret. Register this workflow
# (release.yml in jsilvanus/notify-core) as a Trusted Publisher on npmjs.com for @jsilvanus/notify-core.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: Version Packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
